name: Improvement or workflow idea
description: Propose a clearer synthetic care experience, learning resource, or teaching-core improvement
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Asclepius helps healthcare stakeholders explore synthetic care workflows, with
        a local FHIR teaching core for developers. **NOT FOR CLINICAL USE**.
        See the [project overview](https://github.com/SafetyMP/Asclepius#readme)
        and [design rationale](https://github.com/SafetyMP/Asclepius/blob/main/docs/DESIGN-PIVOT.md).
        Use fictional examples only; do not include real patient data or credentials.
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - Care journeys or care-team handoff
        - Record context or validation explanations
        - Accessibility or visual design
        - Documentation or learning material
        - FHIR schemas or local API
        - Architecture, tooling, or CI
        - Unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Who needs this, and what are they trying to understand or do?
      description: Describe the stakeholder or developer need and the current friction.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Describe a concrete change. A technical design is not required.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: How would we know it helped?
      description: A visible outcome or example is enough. Avoid claims of clinical effectiveness.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
  - type: checkboxes
    id: scope
    attributes:
      label: Project scope
      options:
        - label: I understand this project is synthetic and educational, NOT FOR CLINICAL USE.
          required: true
        - label: This proposal does not require real patient data or connections to clinical systems.
          required: true
